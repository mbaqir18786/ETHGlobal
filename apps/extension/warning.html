<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HexFence // Transaction Recipient Audit</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #F4F2EC;
      color: #151515;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      padding: 16px;
      user-select: none;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #151515;
      padding-bottom: 12px;
      margin-bottom: 16px;
    }
    .logo-badge {
      font-weight: 900;
      font-size: 13px;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .lang-switcher select {
      background: #151515;
      color: #C6F36B;
      border: 1px solid #151515;
      font-size: 11px;
      font-weight: bold;
      padding: 4px 8px;
      font-family: monospace;
      cursor: pointer;
    }
    .status-card {
      border: 2px solid #151515;
      padding: 14px;
      margin-bottom: 16px;
      box-shadow: 3px 3px 0px #151515;
    }
    .status-badge {
      display: inline-block;
      font-family: monospace;
      font-size: 11px;
      font-weight: 900;
      padding: 4px 8px;
      border: 1px solid #151515;
      margin-bottom: 8px;
      text-transform: uppercase;
    }
    .status-LOOKALIKE { background: #D94F4F; color: #FFF; }
    .status-APPROVED { background: #2E7D52; color: #FFF; }
    .status-NO_EVIDENCE { background: #151515; color: #FAF9F6; }
    .status-UNSUPPORTED { background: #D97706; color: #FFF; }
    .status-desc {
      font-size: 12px;
      line-height: 1.4;
      font-weight: 500;
    }
    .card {
      background: #FFF;
      border: 2px solid #151515;
      padding: 12px;
      margin-bottom: 14px;
      box-shadow: 2px 2px 0px #151515;
      font-family: monospace;
      font-size: 11px;
    }
    .card-title {
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      color: #555;
      margin-bottom: 6px;
      display: block;
    }
    .addr-box {
      background: #FAF9F6;
      border: 1px solid #151515;
      padding: 8px;
      word-break: break-all;
      font-size: 12px;
      font-weight: bold;
      margin-top: 4px;
    }
    .hl-match {
      background: #C6F36B;
      color: #151515;
      padding: 1px 2px;
      border: 1px solid #151515;
    }
    .hl-diff {
      color: #D94F4F;
    }
    .anatomy-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }
    .chip {
      background: #FAF9F6;
      border: 1px solid #151515;
      padding: 2px 6px;
      font-size: 10px;
      font-weight: bold;
    }
    .privacy-box {
      background: #151515;
      color: #FAF9F6;
      border: 1px solid #151515;
      padding: 8px 10px;
      font-size: 10px;
      font-family: monospace;
      margin-bottom: 14px;
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .actions {
      display: flex;
      gap: 10px;
    }
    .btn {
      flex: 1;
      padding: 10px;
      border: 2px solid #151515;
      font-family: monospace;
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 2px 2px 0px #151515;
      transition: transform 0.1s;
    }
    .btn:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0px #151515; }
    .btn-abort {
      background: #D94F4F;
      color: #FFF;
    }
    .btn-proceed {
      background: #FAF9F6;
      color: #151515;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-badge">
      <span>🛡️</span>
      <span id="txt-app-title">HEXFENCE // SAFE GUARD</span>
    </div>
    <div class="lang-switcher">
      <select id="lang-select">
        <option value="en">English (EN)</option>
        <option value="hi">हिंदी (HI)</option>
      </select>
    </div>
  </div>

  <!-- Dynamic Warning Banner -->
  <div id="status-card" class="status-card">
    <span id="status-badge" class="status-badge">EVALUATING...</span>
    <p id="status-desc" class="status-desc"></p>
  </div>

  <!-- Intended Recipient Display -->
  <div class="card">
    <span id="lbl-intended" class="card-title">INTENDED RECIPIENT:</span>
    <div id="recipient-addr" class="addr-box"></div>
    <div id="transfer-meta" class="anatomy-row"></div>
  </div>

  <!-- Genuine Payee Comparison (if lookalike) -->
  <div id="genuine-card" class="card" style="display: none;">
    <span id="lbl-genuine" class="card-title">MIMICKED GENUINE PAYEE:</span>
    <div id="genuine-addr" class="addr-box"></div>
    <div id="collision-anatomy" class="anatomy-row"></div>
  </div>

  <!-- Privacy Guarantee Banner -->
  <div class="privacy-box">
    <span>🔒</span>
    <span id="txt-privacy">LOCAL CLIENT PRIVACY: Verified 100% on-device against local Arkiv snapshot. Recipient never transmitted to server.</span>
  </div>

  <!-- Action Controls -->
  <div class="actions">
    <button id="btn-abort" class="btn btn-abort">Abort Transaction</button>
    <button id="btn-proceed" class="btn btn-proceed">Proceed Anyway</button>
  </div>

  <script src="dist/ui/warning.js" type="module"></script>
</body>
</html>
